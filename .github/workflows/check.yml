name: Komorebi Island 3D checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Check interior 3D module syntax
        run: node --check rooms3d.js
      - name: Check 3D watering module syntax
        run: node --check watering3d.js
      - name: Check time-of-day module syntax
        run: node --check daynight.js
      - name: Check original Moko module syntax
        run: node --check moko3d.js
      - name: Check night festival and HD scaling syntax
        run: |
          node --check nightfestival.js
          node --check render-quality.js
      - name: Validate sky gradient shader syntax
        run: node --check sky-gradient.js
      - name: Validate large-world expansion syntax
        run: |
          node --check world-expansion-v23.js
          node --check spaceport3d.js
          node --check sealine3d.js
          node --check expansion3d.js
      - name: Run smoke tests
        run: node --test tests/*.test.mjs
