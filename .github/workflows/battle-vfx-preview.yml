name: Battle spell visual regression
on:
  push:
    branches: [main]
    paths:
      - 'battle3d.js'
      - 'battle-effects.js'
      - 'game.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/battle-vfx-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Launch local deterministic battle
        shell: bash
        run: |
          cat > preview-battlefx.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"></head><body><script>
          localStorage.setItem('komorebi_island_3d_v01',JSON.stringify({
            version:1,coins:85,x:0,z:3,day:2,angle:0,welcomeSeen:true,
            inventory:{berry:2,wood:1,seed:2},redevelopmentProgress:32
          }));
          location.replace('/index.html?demo=battlefx');
          </script></body></html>
          EOF
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/komorebi-battle-serve.log 2>&1 &
          sleep 2
      - name: Capture charge, impact and counterattack on phone-sized Chrome
        shell: bash
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          for pair in "1000:charge" "2350:impact" "3050:counter"; do
            ms="$(echo "$pair" | cut -d: -f1)"
            name="$(echo "$pair" | cut -d: -f2)"
            "$CHROME" --headless --no-sandbox --disable-dev-shm-usage \
              --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader \
              --hide-scrollbars --window-size=414,896 \
              "--virtual-time-budget=$ms" \
              "--screenshot=$RUNNER_TEMP/battle-$name.png" \
              http://127.0.0.1:8765/preview-battlefx.html
            test -s "$RUNNER_TEMP/battle-$name.png"
          done
      - name: Save rendered frames
        uses: actions/upload-artifact@v4
        with:
          name: battle-spell-phone-frames
          path: |
            \${{ runner.temp }}/battle-charge.png
            \${{ runner.temp }}/battle-impact.png
            \${{ runner.temp }}/battle-counter.png
          retention-days: 5
