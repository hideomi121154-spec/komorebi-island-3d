name: Visual preview (mobile island)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-preview.yml'
      - 'game.js'
      - 'redevelopment3d.js'
      - 'expansion3d.js'
      - 'daynight.js'
      - 'sky-gradient.js'
      - 'styles.css'
      - 'index.html'
      - 'sealine3d.js'
      - 'world-expansion-v23.js'
      - 'nightfestival.js'
      - 'render-quality.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Create a repeatable local mobile preview
        shell: bash
        run: |
          cat > preview-seed.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"></head><body><script>
          localStorage.setItem('komorebi_island_3d_v01',JSON.stringify({
            version:1,day:2,coins:27,x:0,z:3,angle:0,welcomeSeen:true,
            inventory:{berry:2,wood:1,seed:2},
            questBerries:2,redevelopmentProgress:32
          }));
          location.replace('/index.html');
          </script></body></html>
          EOF
          cat > preview-seed-city.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"></head><body><script>
          localStorage.setItem('komorebi_island_3d_v01',JSON.stringify({
            version:1,day:3,coins:185,x:47.4,z:-1.6,angle:0,welcomeSeen:true,
            inventory:{berry:2,wood:1,fish:1,seed:2},currentIsland:'commerce',
            questBerries:2,redevelopmentProgress:32
          }));
          location.replace('/index.html');
          </script></body></html>
          EOF
          cat > preview-seed-route.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"></head><body><script>
          localStorage.setItem('komorebi_island_3d_v01',JSON.stringify({
            version:1,day:2,coins:70,x:0,z:3,angle:0,welcomeSeen:true,
            inventory:{berry:1,wood:1,seed:2},redevelopmentProgress:32
          }));
          location.replace('/index.html?view=sealine');
          </script></body></html>
          EOF
          cat > preview-seed-train.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"></head><body><script>
          localStorage.setItem('komorebi_island_3d_v01',JSON.stringify({
            version:1,day:2,coins:70,x:17.4,z:2.85,angle:0,welcomeSeen:true,
            inventory:{berry:1,wood:1,seed:2},redevelopmentProgress:32
          }));
          location.replace('/index.html?demo=train');
          </script></body></html>
          EOF
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/komorebi-http.log 2>&1 &
          sleep 2
      - name: Install Japanese font for a faithful iPhone-like text layout
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Render Chrome portrait screenshot
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo 'No Chrome executable installed'; exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader \
            --hide-scrollbars --window-size=414,896 --virtual-time-budget=8500 \
            "--screenshot=$RUNNER_TEMP/island-mobile.png" \
            http://127.0.0.1:8765/preview-seed.html
          test -s "$RUNNER_TEMP/island-mobile.png"
          file "$RUNNER_TEMP/island-mobile.png"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader \
            --hide-scrollbars --window-size=414,896 --virtual-time-budget=8500 \
            "--screenshot=$RUNNER_TEMP/commercial-island.png" \
            http://127.0.0.1:8765/preview-seed-city.html
          test -s "$RUNNER_TEMP/commercial-island.png"
          file "$RUNNER_TEMP/commercial-island.png"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader \
            --hide-scrollbars --window-size=414,896 --virtual-time-budget=8500 \
            "--screenshot=$RUNNER_TEMP/sea-line-panorama.png" \
            http://127.0.0.1:8765/preview-seed-route.html
          test -s "$RUNNER_TEMP/sea-line-panorama.png"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader \
            --hide-scrollbars --window-size=414,896 --virtual-time-budget=3900 \
            "--screenshot=$RUNNER_TEMP/sea-train-ride.png" \
            http://127.0.0.1:8765/preview-seed-train.html
          test -s "$RUNNER_TEMP/sea-train-ride.png"
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-portrait-preview
          path: |
            ${{ runner.temp }}/island-mobile.png
            ${{ runner.temp }}/commercial-island.png
            ${{ runner.temp }}/sea-line-panorama.png
            ${{ runner.temp }}/sea-train-ride.png
          retention-days: 3
