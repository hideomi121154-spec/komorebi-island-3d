name: Graphics smoke tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/komorebi-http.log 2>&1 &
          node tests/graphics-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-screenshots
          path: test-artifacts/
